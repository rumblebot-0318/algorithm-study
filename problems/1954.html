<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1954 달팽이 숫자</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap"><div class="nav"><a href="../index.html">← 홈</a><a href="https://github.com/rumblebot-0318/algorithm-study/tree/main/SWEA/D2/1954-%EB%8B%AC%ED%8C%BD%EC%9D%B4-%EC%88%AB%EC%9E%90">GitHub 풀이</a></div><section class="hero"><div class="eyebrow">SWEA 1954</div><h1>달팽이 숫자: 갈 수 있으면 이동, 막히면 회전</h1><p>방향은 오른쪽 → 아래 → 왼쪽 → 위 순서로 반복한다.</p></section><section class="split"><article class="panel"><h2>N = <span id="nText">4</span></h2><input id="n" type="range" min="2" max="7" value="4"><div class="viz" id="grid"></div></article><article class="panel"><h2>읽는 법</h2><pre><code>while (num <= N * N) {
    if (canMove(ny, nx)) move();
    else turnRight();
}</code></pre><p class="note">복잡하게 몇 칸씩 갈지 세기보다, 매번 다음 한 칸만 보고 판단하면 구현이 단순해진다.</p></article></section></main><script>const n=document.getElementById('n'),nText=document.getElementById('nText'),grid=document.getElementById('grid');function snail(N){let a=Array.from({length:N},()=>Array(N).fill(0));let dy=[0,1,0,-1],dx=[1,0,-1,0],y=0,x=0,d=0;for(let num=1;num<=N*N;num++){a[y][x]=num;let ny=y+dy[d],nx=x+dx[d];if(ny<0||ny>=N||nx<0||nx>=N||a[ny][nx]){d=(d+1)%4;ny=y+dy[d];nx=x+dx[d]}y=ny;x=nx}return a}function render(){let N=Number(n.value);nText.textContent=N;let a=snail(N);grid.innerHTML=`<div style="display:grid;grid-template-columns:repeat(${N},1fr);gap:8px">`+a.flat().map(v=>`<div style="padding:12px;text-align:center;border-radius:10px;background:#13204a;border:1px solid var(--line);font-weight:900">${v}</div>`).join('')+'</div>'}n.addEventListener('input',render);render();</script></body></html>
